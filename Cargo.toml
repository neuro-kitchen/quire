[workspace]
resolver = "2"
members = [
    "crates/quire-model",
    "crates/quire-io",
    "crates/quire-core",
    "crates/quire-store",
    "crates/quire-fetch",
    "crates/quire-engine",
    "crates/quire-connector",
    "crates/quire-sync",
    "crates/quire-hub",
    "crates/quire-ffi",
    "crates/quire-document",
    "crates/quire-testkit",
    "crates/uniffi-bindgen",
    "app/quire-cli",
    "app/quire-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"   # installed toolchain; dependencies need >= 1.95 (see .knowledge/engineering.md)
authors = ["jesusdpa1 <17010046+jesusdpa1@users.noreply.github.com>"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Versions checked with `cargo info` (crates.io); always the latest (.knowledge/engineering.md).
# Add each to a crate with `<name>.workspace = true`.

# Our crates
quire-model = { path = "crates/quire-model" }
quire-io = { path = "crates/quire-io" }
quire-core = { path = "crates/quire-core" }
quire-store = { path = "crates/quire-store" }
quire-fetch = { path = "crates/quire-fetch" }
quire-engine = { path = "crates/quire-engine" }
quire-connector = { path = "crates/quire-connector" }
quire-sync = { path = "crates/quire-sync" }
quire-hub = { path = "crates/quire-hub" }
quire-document = { path = "crates/quire-document" }
quire-testkit = { path = "crates/quire-testkit" }   # dev-dependency only
quire-tui = { path = "app/quire-tui" }

# Configuration & paths (figment skipped: last release 2024, see .knowledge/engineering.md)
etcetera = "0.11.0"
toml = "1.1.8"
toml_edit = "0.25.17"

# Network (reqwest 0.13 defaults to rustls: no OpenSSL)
reqwest = { version = "0.13.5", features = ["gzip"] }
scraper = "0.27.0"
roxmltree = "0.21.1"
url = "2.5.8"

# Sync between devices over QUIC: dial a device by its public key, hole punching, relay fallback
iroh = "1.3.0"

# Secrets in the system keyring (Secret Service, Keychain, Credential Manager)
keyring = "4.2.0"

# TUI (`quire tui`): ratatui on crossterm 0.29 (the same crossterm for both)
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }   # osc52: copy to the clipboard
futures-util = "0.3.34"
nucleo-matcher = "0.3.1"
# Figure images in the reader on graphics terminals (kitty, sixel, iTerm2): 11.1 is the latest stable
# (12 is a release candidate); no libchafa (default features off); decoders for figure formats only.
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Local server (`quire serve`)
axum = "0.8.9"
getrandom = "0.4.3"

# Async & logging
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Database (SQLite built in; `rusqlite_migration` and `tokio-rusqlite` require rusqlite 0.40)
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
tokio-rusqlite = "0.8.0"

# Text
bytemuck = "1.25.2"
deunicode = "1.6.2"
unicode-normalization = "0.1.26"

# Bibliography formats
biblatex = "0.12.0"
hayagriva = { version = "0.10.1", default-features = false, features = ["biblatex"] }

# Files (content-addressed attachments; PDF checks)
blake3 = "1.8.7"
# Sealing sync data for a hub (XChaCha20-Poly1305; RustCrypto, NCC-audited line; `.knowledge/sync-hub.md`)
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
# Hub messages as Protocol Buffers (derive only, no protoc): the same schema serves a gRPC service later
prost = "0.14.4"
# Library backups (`quire library backup`): one .tar.gz
tar = "0.4.46"
flate2 = "1.1.10"
# EPUB containers (`quire-document::epub`): deflate only, through flate2 (pure Rust); no C codecs
# or crypto.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
pdf-inspector = "1.25.2"
# PDF objects (the parser pdf-inspector uses): revealing invisible OCR text layers
lopdf = "0.45.0"
# Pure-Rust PDF interpreter and rasterizer (the reader's pages, `quire-document`). Pre-1.0: exact
# versions, upgraded deliberately after reading the changelog (.knowledge/pdf-engine.md).
hayro = "=0.8.0"
hayro-interpret = "=0.8.0"
hayro-syntax = "=0.8.0"
hayro-cmap = "=0.1.0"

# IDs
uuid = { version = "1.28.0", features = ["v7"] }
typeid_suffix = "1.3.0"

# Serialization & errors
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
anstream = "1.0.0"
anstyle = "1.0.14"
tabled = { version = "0.22.0", default-features = false, features = ["std", "ansi"] }
terminal_size = "0.4.4"
indicatif = "0.18.6"
rpassword = "7.5.4"
libc = "0.2.191"

# Testing
insta = "1.49.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

# Kotlin bindings for the desktop and mobile apps (`app/`): `quire-ffi`, generated by `uniffi-bindgen`
uniffi = "0.32.2"


# The apps' native library (`app/`, `quire-ffi`), without debug info (with it the library is
# ~500 MB inside the app's jar). Symbols stay: UniFFI reads its metadata from them.
# `app-dev` for development builds; `-Pquire.release` builds `app-release`.
[profile.app-dev]
inherits = "dev"
debug = false
strip = "debuginfo"

[profile.app-release]
inherits = "release"
strip = "debuginfo"
