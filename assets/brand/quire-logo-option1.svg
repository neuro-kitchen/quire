<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!--
    Quire Brand Icon - Option 1 (Flat Crescent & Feather Q)
    Crafted for clean vector editing in Figma, Illustrator, or code.
  -->
  <defs>
    <!-- Tile Background Gradient -->
    <radialGradient id="tile-bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1B1C2A" />
      <stop offset="50%" stop-color="#12131C" />
      <stop offset="100%" stop-color="#0A0B10" />
    </radialGradient>

    <!-- Subtle Bevel Border Stroke -->
    <linearGradient id="tile-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Left Crescent Gradient (Deep Indigo to Electric Violet) -->
    <linearGradient id="q-crescent-grad" x1="20%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="80%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Feather Spine Gradient -->
    <linearGradient id="feather-spine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="85%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Feather Outer Vanes Gradient (Cyan to Violet) -->
    <linearGradient id="feather-vane-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Feather Inner Barbs Gradient -->
    <linearGradient id="feather-inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Q Tail Gradient -->
    <linearGradient id="q-tail-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Tile Drop Shadow -->
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Soft Ambient Glow on the Q Mark -->
    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="464" height="464" rx="108" ry="108" />
    </clipPath>
  </defs>

  <!-- Squircle App Tile -->
  <g id="app-tile" filter="url(#tile-shadow)">
    <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#tile-bg)" />
    <rect x="24.5" y="24.5" width="463" height="463" rx="107.5" ry="107.5" stroke="url(#tile-border)" stroke-width="1.5" />
  </g>

  <!-- Clipped Tile Contents -->
  <g clip-path="url(#squircle-clip)">
    <!-- Ambient Light Spill -->
    <circle cx="240" cy="240" r="170" fill="url(#ambient-glow)" />

    <!-- ======================================================== -->
    <!-- THE QUIRE "Q" MARK (Left Crescent + Right Feather)       -->
    <!-- ======================================================== -->
    <g id="quire-mark" filter="url(#mark-glow)" transform="translate(6, 2)">

      <!-- LAYER 1: Left Circular Crescent -->
      <!-- Smooth, confident circular arc that forms the solid left half of the Q -->
      <path id="left-crescent"
            d="M 238 90 
               C 152 90, 84 158, 84 244 
               C 84 330, 152 398, 238 398 
               C 252 398, 268 395, 282 388 
               L 266 342 
               C 257 346, 248 348, 238 348 
               C 180 348, 134 302, 134 244 
               C 134 186, 180 140, 238 140 
               C 250 140, 264 143, 276 149 
               L 290 102 
               C 273 94, 256 90, 238 90 Z"
            fill="url(#q-crescent-grad)" />

      <!-- LAYER 2: Right Half - Integrated Feather Vanes -->
      <!-- Clean geometric feather vanes curving along the right perimeter -->
      <g id="feather-outer-vanes" fill="url(#feather-vane-grad)">
        <!-- Vane 1: Upper right barb -->
        <path d="M 298 106 
                 C 342 128, 376 166, 390 204 
                 L 348 214 
                 C 338 188, 314 160, 284 146 
                 Z" />

        <!-- Vane 2: Upper-middle right barb -->
        <path d="M 396 214 
                 C 404 242, 404 274, 392 304 
                 L 352 292 
                 C 360 270, 362 246, 354 224 
                 Z" />

        <!-- Vane 3: Lower-middle right barb -->
        <path d="M 390 314 
                 C 376 346, 352 372, 318 390 
                 L 288 350 
                 C 312 336, 332 316, 344 294 
                 Z" />
      </g>

      <!-- LAYER 3: Inner Feather Barbs (Inside the counter) -->
      <g id="feather-inner-barbs" fill="url(#feather-inner-grad)">
        <path d="M 306 172 
                 C 328 196, 338 226, 336 256 
                 L 302 248 
                 C 304 228, 298 208, 284 192 
                 Z" />

        <path d="M 334 266 
                 C 330 292, 316 316, 294 334 
                 L 272 304 
                 C 284 292, 294 278, 298 260 
                 Z" />
      </g>

      <!-- LAYER 4: The Feather Quill Spine / Shaft -->
      <!-- Fluid curved spine connecting the top apex through the right arc to the tail -->
      <path id="feather-spine"
            d="M 278 100 
               C 350 144, 376 226, 342 322 
               L 418 408"
            stroke="url(#feather-spine-grad)"
            stroke-width="5"
            stroke-linecap="round" />

      <!-- LAYER 5: The "Q" Tail (Sweeping Feather Tip / Quill Nib) -->
      <!-- Lower right flourish forming the distinctive signature tail of the letter Q -->
      <g id="q-tail">
        <!-- Main tail blade -->
        <path d="M 334 326 
                 L 416 408 
                 C 426 418, 424 430, 412 436 
                 C 400 442, 388 436, 378 426 
                 L 300 348 
                 C 312 342, 324 334, 334 326 Z" 
              fill="url(#q-tail-grad)" />

        <!-- Accent plume on the tail tip -->
        <path d="M 374 366 
                 L 444 436 
                 C 452 444, 450 454, 440 458 
                 C 432 460, 424 456, 418 448 
                 L 354 388 
                 Z" 
              fill="#38BDF8" 
              opacity="0.9" />

        <!-- Crisp white spine highlight at tail exit -->
        <path d="M 348 338 L 428 420" 
              stroke="#FFFFFF" 
              stroke-width="2.5" 
              stroke-linecap="round" 
              opacity="0.9" />
      </g>

    </g>
  </g>
</svg>
