<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="tile-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1A1C2B" />
      <stop offset="55%" stop-color="#10111A" />
      <stop offset="100%" stop-color="#090A0F" />
    </radialGradient>

    <!-- Border highlight -->
    <linearGradient id="tile-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01" />
    </linearGradient>

    <!-- Ribbon Loop Outer Gradient (Indigo to Violet) -->
    <linearGradient id="loop-primary" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Ribbon Inner/Fold Gradient (Luminous Cyan-Violet) -->
    <linearGradient id="loop-inner" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Feather Tail Gradient -->
    <linearGradient id="feather-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="30%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="core-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <filter id="tile-drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#4F46E5" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <clipPath id="squircle">
      <rect x="24" y="24" width="464" height="464" rx="108" ry="108" />
    </clipPath>
  </defs>

  <!-- Squircle Canvas Tile -->
  <g filter="url(#tile-drop-shadow)">
    <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#tile-bg)" />
    <rect x="24.5" y="24.5" width="463" height="463" rx="107.5" ry="107.5" stroke="url(#tile-stroke)" stroke-width="1.5" />
  </g>

  <!-- Inner Clipped Branding -->
  <g clip-path="url(#squircle)">
    <!-- Radial Ambient Illumination behind the loop -->
    <circle cx="236" cy="226" r="160" fill="url(#core-glow)" />

    <!-- Sleek Loop Transformed into Q with Feather Tail -->
    <g filter="url(#logo-shadow)">

      <!-- Back curve of the loop (upper inside twist) -->
      <path d="M 170 180 
               C 185 130, 240 100, 290 120 
               C 335 138, 362 180, 362 230 
               C 362 260, 348 288, 326 308 
               C 300 270, 290 220, 290 180 
               C 290 148, 250 148, 220 160 
               Z" 
            fill="url(#loop-inner)" 
            opacity="0.75" />

      <!-- Main Continuous Outer Ribbon Loop (The Circular Body of the Q) -->
      <!-- Smooth, continuous curved stroke with varying thickness like a fluid band -->
      <path d="M 236 92 
               C 152 92, 88 156, 88 238 
               C 88 320, 152 384, 236 384 
               C 278 384, 316 367, 344 338 
               L 312 308 
               C 292 328, 265 340, 236 340 
               C 176 340, 132 294, 132 238 
               C 132 182, 176 136, 236 136 
               C 296 136, 340 182, 340 238 
               C 340 262, 331 284, 316 300 
               L 348 332 
               C 370 306, 384 274, 384 238 
               C 384 156, 320 92, 236 92 Z" 
            fill="url(#loop-primary)" />

      <!-- Inner Ribbon Fold Highlight (Accent crest) -->
      <path d="M 120 200 
               C 114 238, 126 280, 154 312 
               C 178 338, 212 356, 248 356 
               C 292 356, 330 330, 348 296 
               C 334 266, 306 244, 272 234 
               C 222 220, 168 226, 120 200 Z" 
            fill="url(#loop-inner)" 
            opacity="0.85" />

      <!-- The Feather / Quill Tail: Elegantly extending from the lower-right loop -->
      <!-- Upper Barb / Vane -->
      <path d="M 302 286 
               L 384 368 
               C 392 356, 404 350, 418 354 
               C 424 356, 428 360, 432 366 
               L 446 380 
               C 454 388, 452 400, 442 406 
               L 416 422 
               C 402 430, 386 426, 376 416 
               L 292 332 
               C 288 316, 292 298, 302 286 Z" 
            fill="url(#feather-grad)" />

      <!-- Secondary Lower Feather Plume / Barb Leaf -->
      <path d="M 358 376 
               L 426 444 
               C 434 452, 446 450, 452 442 
               C 456 436, 456 428, 450 422 
               L 392 364 
               Z" 
            fill="#A5B4FC" 
            opacity="0.9" />

      <!-- Central Feather Quill Shaft (Rachis) - Clean crisp stroke -->
      <path d="M 300 290 L 448 438" 
            stroke="#FFFFFF" 
            stroke-width="3" 
            stroke-linecap="round" 
            opacity="0.8" />

      <!-- Delicate barb slits in the feather for organic quill texture -->
      <path d="M 364 340 L 378 332" stroke="#E0E7FF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <path d="M 396 372 L 412 364" stroke="#E0E7FF" stroke-width="2" stroke-linecap="round" opacity="0.6" />

      <!-- Ambient Light Rim on top curve of the Q loop -->
      <path d="M 160 150 
               C 182 124, 212 110, 246 110 
               C 288 110, 324 130, 348 160" 
            stroke="#A5B4FC" 
            stroke-width="3.5" 
            stroke-linecap="round" 
            opacity="0.75" />

    </g>
  </g>
</svg>
