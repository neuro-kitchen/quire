<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="q-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926" />
      <stop offset="100%" stop-color="#0E0F17" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <linearGradient id="secondary-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <linearGradient id="accent-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <linearGradient id="tail-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Depth -->
    <filter id="shadow-main" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="inner-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="240" cy="240" r="190" fill="url(#glow-grad)" />

  <!-- Quire Logo Graphic (The Codex 'Q') -->
  <g filter="url(#shadow-main)" transform="translate(4, -4)">
    
    <!-- Leaf 1: Back sheet / parchment layer (Outer counter) -->
    <path d="M 240 76 
             C 145 76, 80 148, 80 244 
             C 80 340, 145 412, 240 412 
             C 278 412, 314 399, 344 376 
             L 316 344 
             C 294 360, 268 368, 240 368 
             C 172 368, 126 312, 126 244 
             C 126 176, 172 120, 240 120 
             C 308 120, 354 176, 354 244 
             C 354 266, 348 288, 336 306 
             L 368 334 
             C 388 308, 400 277, 400 244 
             C 400 148, 335 76, 240 76 Z" 
          fill="url(#primary-grad)" />

    <!-- Leaf 2: Secondary overlapping folded folio sheet (Top right into center) -->
    <path d="M 240 120 
             C 308 120, 354 176, 354 244 
             C 354 274, 342 302, 324 322 
             C 300 292, 280 252, 280 208 
             C 280 162, 262 136, 240 120 Z" 
          fill="url(#secondary-grad)" 
          opacity="0.85" />

    <!-- Leaf 3: Inner page fold (Curving through the counter) -->
    <path d="M 190 190 
             C 220 155, 265 155, 296 186 
             C 328 218, 328 266, 296 304 
             C 272 334, 236 348, 204 336 
             C 228 316, 244 286, 244 252 
             C 244 220, 222 198, 190 190 Z" 
          fill="url(#accent-leaf)" />

    <!-- The Tail of the Q: A dynamic folded leaf / pen flourish angled downward-right -->
    <path d="M 284 288 
             L 392 396 
             C 406 410, 428 410, 442 396 
             C 456 382, 456 360, 442 346 
             L 348 252 
             C 334 268, 310 280, 284 288 Z" 
          fill="url(#tail-grad)" 
          filter="url(#inner-shadow)" />

    <!-- Sharp leaf highlight crease on the tail -->
    <path d="M 314 282 L 442 396" 
          stroke="#E0E7FF" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.75" />

    <!-- Inner fold light accent -->
    <path d="M 152 176 
             C 176 142, 206 128, 240 128" 
          stroke="#C7D2FE" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          opacity="0.6" />
  </g>
</svg>
