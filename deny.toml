# cargo-deny configuration (`cargo deny check licenses bans sources`)
#
# Ensures every third-party dependency statically linked into Quire binaries
# (`quire`, `quire-hub`, and `libquire_ffi.so` for Desktop/Android/iOS) uses a
# permissive or weak-copyleft license compatible with commercial app-store and
# cloud distribution, while our own workspace crates use `AGPL-3.0-or-later`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.8

# Permissive and file-level weak-copyleft licenses allowed for third-party dependencies.
# Third-party GPL / AGPL / LGPL-only crates are denied so static linking never restricts
# NeuroKitchen's ability to distribute official mobile/cloud binaries under dual/commercial terms.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unlicense",
    "WTFPL",
]

# First-party workspace crates are authored by NeuroKitchen under AGPL-3.0-or-later.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "quire-cli" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-connector" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-core" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-document" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-engine" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-fetch" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-ffi" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-hub" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-io" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-model" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-store" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-sync" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-testkit" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-tui" },
    { allow = ["AGPL-3.0-or-later"], crate = "uniffi-bindgen" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
