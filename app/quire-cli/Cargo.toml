[package]
name = "quire-cli"
description = "quire from the command line: projects, add by DOI/arXiv/PubMed/URL, import and export .bib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "quire"
path = "src/main.rs"

[features]
default = ["tui"]
# `quire tui`; without it the binary is CLI-only (no ratatui/crossterm).
tui = ["dep:quire-tui"]

[dependencies]
quire-engine.workspace = true
quire-connector.workspace = true
quire-tui = { workspace = true, optional = true }
quire-model.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap_complete.workspace = true
anstream.workspace = true
anstyle.workspace = true
tabled.workspace = true
terminal_size.workspace = true
indicatif.workspace = true
rpassword.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

