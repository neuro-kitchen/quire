ses coherent manipulation of the electronic spin associated with nitrogen&#8211;vacancy colour centres in diamond. Our technique makes it possible to detect temperature variations as small as 1.8&#8201;mK (a sensitivity of 9&#8201;mK&#8201;Hz&#8722;1/2) in an ultrapure bulk diamond sample. Using nitrogen&#8211;vacancy centres in diamond nanocrystals (nanodiamonds), we directly measure the local thermal environment on length scales as short as 200&#8201;nanometres. Finally, by introducing both nanodiamonds and gold nanoparticles into a single human embryonic fibroblast, we demonstrate temperature-gradient control and mapping at the subcellular level, enabling unique potential applications in life sciences."/>
